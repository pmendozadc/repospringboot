
<header>
  <nav class="navbar">

    <h1 class="logo">MiSitio</h1>

    <ul class="nav-links"
        [class.active]="menuAbierto">

      <li>
        <a href="#" (click)="menuAbierto = false">Inicio</a>
      </li>

      <li>
        <a href="#" (click)="menuAbierto = false">Servicios</a>
      </li>

      <li>
        <a href="#" (click)="menuAbierto = false">Contacto</a>
      </li>

    </ul>

    <div class="menu-toggle"
         (click)="toggleMenu()">

      ☰

    </div>

  </nav>
</header>

<!-- Botón para abrir modal -->
<button class="btn-open"
        (click)="abrirModal()">

  Abrir ventana

</button>

<!-- Ventana modal -->
@if (modalAbierto) {

  <div class="modal"
       (click)="toggleModal($event)">

    <div class="modal-content">

      <span class="close"
            (click)="cerrarModal()">

        &times;

      </span>

      <h2>Título del Modal</h2>

      <p>Contenido del modal</p>

    </div>

  </div>

}

<router-outlet />

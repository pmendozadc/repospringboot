<h2>Lista de productos</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Producto</th>
      <th>Precio</th>
    </tr>
  </thead>

  <tbody>
    @for (producto of productos; track producto.id) {
      <tr>
        <td>{{ producto.id }}</td>
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.precio }}</td>
        <td>
          <button (click)="editarProducto(producto)">
            Editar
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">No hay productos disponibles</td>
      </tr>
    }
  </tbody>
</table>
@if (mostrarModal) {
  <app-modal-producto
    [producto]="productoSeleccionado"
    (cerrar)="cerrarModal()">
  </app-modal-producto>
}
